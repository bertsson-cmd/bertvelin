name: Bertpicker

on:
  schedule:
    # 07:00 UTC = 07:00 in Reykjavík (Iceland is UTC year-round).
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual refresh

permissions:
  contents: write   # commits history/picks/results/archive back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Code integrity check (fails loudly if any file has wrong content)
        run: |
          python3 -m py_compile main.py analyzer/*.py
          python3 -c "
          from analyzer.odds import build_legs, market_margin
          from analyzer.parlay import band_for_day, build_parlays, pick_two_slips, pick_risky_slip, pick_banker_slip
          from analyzer.api_source import load_from_api
          from analyzer.report import render_report
          from analyzer.enrich import enrich, attach_gemini_intelligence
          from analyzer.results import settle_pending, record_picks, load_locked_slips
          from analyzer.archive import archive_report
          print('integrity OK: every module is in its right file')"

      - name: Build briefing (settle yesterday + odds + reasoning + slips + archive)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_SHEET_URL: ${{ secrets.ODDS_SHEET_URL }}
        run: |
          python3 main.py --api --enrich --out reports/index.html

      - name: Commit memory (odds history, picks ledger, results, archive)
        run: |
          git config user.name "wc26-bot"
          git config user.email "wc26-bot@users.noreply.github.com"
          git add data/history.json data/picks.json data/results.json reports/archive
          git commit -m "daily memory $(date -u +%F)" || echo "no change"
          git pull --rebase || true
          git push || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - id: deployment
        uses: actions/deploy-pages@v4
